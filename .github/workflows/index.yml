name: index

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Test Magpie
        run: node --test tests/magpie.test.mjs
      - name: Rebuild index.json with the official builder
        env:
          BUILDER_SHA256: 9816c1d6436043c66c0946b1bbd3489a0d089fd1522b959d3d66e754131c67d5
        run: |
          curl -fsS https://metrix.bar/dashboards/build.js -o "$RUNNER_TEMP/build.js"
          echo "$BUILDER_SHA256  $RUNNER_TEMP/build.js" | sha256sum -c -
          node "$RUNNER_TEMP/build.js" --input . --output "$RUNNER_TEMP/out" --id thedavidweng --name "David Weng's Dashboards"
          diff -u "$RUNNER_TEMP/out/index.json" index.json
